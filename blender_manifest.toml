schema_version = "1.0.0"

id = "key_hint"
version = "2.0.2"
name = "Key Hint"
tagline = "Your own shortcut list, mirrored by a 3D-viewport HUD"
maintainer = "Noct2vis <rv24726@bristol.ac.uk>"

type = "add-on"

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# Tags are matched against Blender's own tag lists when publishing to
# extensions.blender.org (see the extension build/validate docs).
tags = ["3D View"]

website = "https://github.com/Noct2vis/key_hint"

# Runtime dependencies of this add-on.
python_version = ""

# Packaging: ship the add-on itself and nothing else.
#
# NOTE: as soon as [build].paths_exclude_pattern is set, the builder's OWN
# default excludes (.git/**, __pycache__, *.pyc, ...) no longer apply — the
# list below replaces them, so the defaults are repeated here on purpose.
# AGENTS.md / docs/ are this repo's agent/skill scaffolding (issue tracker,
# triage labels, domain docs): they belong in the repository, not in the
# extension users install.
[build]
paths_exclude_pattern = [
  ".*",             # dot-prefixed files/dirs: .git, .gitignore, .scratch, ...
  "*__pycache__*",  # bytecode dirs at any depth
  "*.pyc",
  "*.zip",          # build outputs, so a rebuild can't package the previous one
  "AGENTS.md",
  "docs/**",
]
